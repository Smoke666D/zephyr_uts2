CONFIG_CUSTOM_SEQ_MUX_ADC=y


CONFIG_PINCTRL_DYNAMIC=y 

#Включаем zbus
CONFIG_ZBUS=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

CONFIG_I2C=y
CONFIG_SENSOR=y

CONFIG_SPI=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_RTIO=y

# Драйвер датчиков TI INA
# (Включаем обе опции, компилятор сам выберет нужную для вашей версии Zephyr)
CONFIG_INA2XX=y
CONFIG_INA228=y


CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="USBD CDC ACM sample"

#Конфигурация перефирии
CONFIG_GPIO=y
CONFIG_COUNTER=y
CONFIG_PINCTRL=y


# DMA
CONFIG_DMA=y
CONFIG_DMA_STM32=y
CONFIG_DMA_LOG_LEVEL_DBG=y


# Настройка Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y

# Включить команды просмотра дерева устройств (device)
CONFIG_DEVICE_SHELL=y


# Поддержка чисел с плавающей точкой в printk/shell_fprintf
