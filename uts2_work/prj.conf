# ==========================================
# C++
# ==========================================
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# ==========================================
# Базовая периферия
# ==========================================
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_PINCTRL_DYNAMIC=y

CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_EEPROM=y
CONFIG_SETTINGS=y

# ==========================================
# Датчики (INA228 / INA237)
# ==========================================
CONFIG_SENSOR=y
CONFIG_INA228=y

# ==========================================
# USB Device Stack (Next) и CDC ACM
# ==========================================
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# Автоматический запуск USB CDC ACM при старте платы (убирает необходимость ручного кода)
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="USBD CDC ACM sample"

# ==========================================
# Shell (направлен на USB через DeviceTree chosen)
# ==========================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
# Не выводить системные логи в USB Shell (чистый терминал)
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_I2C_SHELL=y
CONFIG_SENSOR_SHELL=y

# ==========================================
# Подсистема логирования (Асинхронная / Потокобезопасная)
# ==========================================
CONFIG_LOG=y
# ВАЖНО: Асинхронный режим, чтобы не рушить тайминги USB
CONFIG_LOG_MODE_DEFERRED=y

# Направлять вызовы printk() через логгер во все бэкенды (USART + RTT)
CONFIG_LOG_PRINTK=y

# Глушим спам от USB/UART
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_UART_LOG_LEVEL_WRN=y


# ==========================================
# Бэкенд логов 1: Аппаратный USART
# ==========================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# ==========================================
# Бэкенд логов 2: SEGGER RTT (через отладчик SWD)
# ==========================================
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
# Сбрасывать логи, если RTT Viewer не подключен (защита от зависания)
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# ==========================================
# Форматирование вывода (float для токов/напряжений)
# ==========================================
CONFIG_CBPRINTF_FP_SUPPORT=y

# ==========================================
# Настройки отладки (Workbench)
# ==========================================
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_STACK_USAGE=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_META=y
CONFIG_OUTPUT_SYMBOLS=y
CONFIG_OUTPUT_STAT=y
CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y