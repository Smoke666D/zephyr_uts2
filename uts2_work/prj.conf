# ==============================================================================
# 1. КЭШ И УПРАВЛЕНИЕ ПАМЯТЬЮ (Cache, MPU & Heap)
# ==============================================================================
CONFIG_ICACHE=y
CONFIG_DCACHE=y
CONFIG_CACHE_MANAGEMENT=y
CONFIG_NOCACHE_MEMORY=y
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_POLL=y



# ==============================================================================
# 2. АППАРАТНАЯ ПЕРИФЕРИЯ И ДАТЧИКИ (Hardware Drivers & Sensors)
# ==============================================================================
CONFIG_GPIO=y
CONFIG_PINCTRL=y
CONFIG_PINCTRL_DYNAMIC=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_DAC=y
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y


# Драйверы микросхем
CONFIG_TMP112=y
CONFIG_BH1750=y
CONFIG_GPIO_PCF857X=y

# Подсистема датчиков (INA228)
CONFIG_SENSOR=y
CONFIG_INA228=y

CONFIG_I2C_STM32_V2_TIMING=y
# ==============================================================================
# 3. DMA И АСИНХРОННЫЙ ВВОД-ВЫВОД (DMA & RTIO)
# ==============================================================================
CONFIG_DMA=y
CONFIG_DMA_STM32=y
CONFIG_DMA_LOG_LEVEL_DBG=y

CONFIG_RTIO=y
CONFIG_I2C_RTIO=y
CONFIG_RTIO_WORKQ_POOL_ITEMS=12

# ==============================================================================
# 4. МЕЖПРОЦЕССНАЯ ШИНА СООБЩЕНИЙ (Zbus)
# ==============================================================================
CONFIG_ZBUS=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

# ==============================================================================
# 5. USB СТЕК (USBD Next & CDC ACM)
# ==============================================================================
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="USBD CDC ACM sample"
CONFIG_UDC_BUF_POOL_SIZE=8192
# ==============================================================================
# 6. КОНСОЛЬ SHELL И ИНТЕРФЕЙСЫ ВВОДА-ВЫВОДА (Shell & Console)
# ==============================================================================
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n
CONFIG_SHELL_VT100_COMMANDS=n
CONFIG_I2C_SHELL=y
CONFIG_SENSOR_SHELL=y
CONFIG_KERNEL_SHELL=y

# Поддержка вывода чисел с плавающей точкой (float/double) в консоль
CONFIG_CBPRINTF_FP_SUPPORT=y

# Не выводить системные логи в USB Shell (чистый терминал)
CONFIG_SHELL_LOG_BACKEND=n

# ==============================================================================
# 7. ПОДСИСТЕМА ЛОГИРОВАНИЯ (Logging, Backends & RTT)
# ==============================================================================
CONFIG_LOG=y
# Асинхронный режим, чтобы не нарушать тайминги USB
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BUFFER_SIZE=4096

# Направлять вызовы printk() через логгер
CONFIG_LOG_PRINTK=y

# Бэкенд 1: Аппаратный UART (ОТКЛЮЧЕН — логи уходят только в RTT)
CONFIG_LOG_BACKEND_UART=n

# Бэкенд 2: SEGGER RTT (SWD)
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# Подавление спама от USB/UART
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_UART_LOG_LEVEL_WRN=y

# ==============================================================================
# 8. ОТЛАДКА, МОНИТОРИНГ ПОТОКОВ И СТАТИСТИКА (Debug & Profiling)
# ==============================================================================
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=n
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_STACK_USAGE=y

CONFIG_THREAD_MONITOR=y             # Разрешает ядру отслеживать список потоков
CONFIG_THREAD_NAME=y                # Имена потоков
CONFIG_THREAD_RUNTIME_STATS=y       # Статистика реального времени
CONFIG_SCHED_THREAD_USAGE=y         # Подсчет времени работы потоков на CPU
CONFIG_SCHED_THREAD_USAGE_ALL=y     # Собирает общую загрузку системы
CONFIG_THREAD_NAME=y

CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_META=y
CONFIG_OUTPUT_SYMBOLS=y
CONFIG_OUTPUT_STAT=y
CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_CRC=y