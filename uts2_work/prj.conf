
#Включаем конечные автоматы ====================================================================
# 1. ПОДДЕРЖКА C++ (C++ SUPPORT)
# ====================================================================
CONFIG_CPP=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_STD_CPP20=y

CONFIG_POLL=y

# ====================================================================
# 2. БАЗОВЫЙ СТЕК USB (USB DEVICE NEXT) & ПОДДЕРЖКА ВВОДА/ВЫВОДА
# ====================================================================
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

# Идентификаторы USB-устройства (CDC ACM Sample)
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="USBD CDC ACM sample"

# Отключаем автоматический запуск USB при загрузке.
# Критично, так как стек запускается вручную через 'enable_usb_device_next()' в main.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Базовые настройки консоли и UART
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y


# ====================================================================
# 4. НАСТРОЙКА КЭША И ПАМЯТИ (CACHE & MPU)
# ====================================================================
CONFIG_ICACHE=y              # Кэш команд
CONFIG_DCACHE=y              # Кэш данных
CONFIG_CACHE_MANAGEMENT=y    # API ядра для управления кэшем
CONFIG_NOCACHE_MEMORY=y      # Разрешает настройку областей MPU без кэширования (__nocache)


# ====================================================================
# 5. СИСТЕМА ЛОГИРОВАНИЯ (LOGGING SYSTEM)
# ====================================================================
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y    # Направляет логгер в дефолтную системную консоль (наш USB CDC_ACM_0)


# ====================================================================
# 6. ШИНА ДАННЫХ ZBUS (ZBUS MIDDLEWARE)
# ====================================================================
CONFIG_ZBUS=y

# Разрешает динамическое добавление слушателей (zbus_chan_add_obs) во время работы
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

# ВКЛЮЧЕНО: Обязательно для работы функции 'zbus_chan_from_name()'.
# Без этого флага поиск ZBus-каналов по строковым именам в Shell работать не будет!
CONFIG_ZBUS_CHANNEL_NAME=y


# ====================================================================
# 7. ИНТЕРАКТИВНАЯ КОНСОЛЬ (SHELL SYSTEM)
# ====================================================================
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_KERNEL_SHELL=y        # Команды диагностики планировщика (kernel uptime/threads)
CONFIG_DEVICE_SHELL=y        # Команды диагностики дерева устройств (device list)

# Отключает дублирование системных логов (LOG_INF) в Shell-порт (CDC_ACM_1).
# Логи остаются только на первом порту, а Shell общается только командами.
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_ERR=y

# ОПЦИОНАЛЬНО (раскомментируйте при запуске скрипта Python):
# Убирает ESC (0x1B) мусорные байты, мешающие Python стабильно парсить ответы.
# CONFIG_SHELL_VT100_COLORS=n
# CONFIG_SHELL_VT100_COMMANDS=n


# ====================================================================
# 8. МАТЕМАТИКА С ПЛАВАЮЩЕЙ ТОЧКОЙ (FLOATING POINT FORMATTING)
# ====================================================================
# Разрешает вывод чисел типа float в функциях printk/shell_fprintf (формат %.4f)
CONFIG_CBPRINTF_FP_SUPPORT=y


# ====================================================================
# 9. ПЕРИФЕРИЯ, СЕНСОРЫ И ДРАЙВЕРЫ ШИН (PERIPHERAL DRIVERS)
# ====================================================================
CONFIG_GPIO=y
CONFIG_COUNTER=y
CONFIG_PINCTRL=y
CONFIG_PINCTRL_DYNAMIC=y

# Системные интерфейсы I2C и SPI
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_SPI_RTIO=y

# Подсистема сенсоров и асинхронный ввод-вывод RTIO
CONFIG_SENSOR=y
CONFIG_SENSOR_ASYNC_API=y
CONFIG_RTIO=y

# Драйверы датчиков тока/напряжения TI INA2xx
CONFIG_INA2XX=y
CONFIG_INA228=y


# ====================================================================
# 10. ПРЯМОЙ ДОСТУП К ПАМЯТИ (DMA CONFIGURATION)
# ====================================================================
CONFIG_DMA=y
CONFIG_DMA_STM32=y
CONFIG_DMA_LOG_LEVEL_DBG=y


# ====================================================================
# 11. КАСТОМНЫЕ ДРАЙВЕРЫ ПРОЕКТА
# ====================================================================
CONFIG_CUSTOM_SEQ_MUX_ADC=y



# ====================================================================
# 12. НАСТРОЙКИ ОТЛАДКИ (Added automatically by Workbench for Zephyr)
# ====================================================================
#--- DEBUG PRESET - BEGIN ---#
# Оптимизация сборки под отладчик (-Og)
#CONFIG_DEBUG_OPTIMIZATIONS=y
## Поддержка отладки потоков ОСРВ (Thread awareness)
#CONFIG_DEBUG_THREAD_INFO=y
# Генерация информации об использовании стека функциями
#CONFIG_STACK_USAGE=y

# Форматы выходных файлов и отладочные отчеты
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_META=y
CONFIG_OUTPUT_SYMBOLS=y
CONFIG_OUTPUT_STAT=y
CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y
#--- DEBUG PRESET - END ---#
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_SMF_INSTRUMENTATION=y

#************* Настройка КЭШ **********************
CONFIG_ICACHE=y  #кэш команд
CONFIG_DCACHE=y  #кэш данных
CONFIG_CACHE_MANAGEMENT=y #функции управления кэш
CONFIG_NOCACHE_MEMORY=y   #разрешает настройку MPU


# ================== НАСТРОЙКИ ПОТОКОБЕЗОПАСНОГО ЛОГГЕРА ==================
CONFIG_LOG=y
